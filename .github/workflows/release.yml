name: Release
# Push a tag vX.Y.Z (matching pubspec.yaml "version") to publish to pub.dev.
# Uses pub.dev automated publishing (GitHub OIDC, no stored secret). Inert until the
# repo variable PUB_DEV_PUBLISHING is "true": tests still run, publish is skipped.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history + origin/main for the on-main check
      - name: Tagged commit is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main. Merge first, then tag a main commit."; exit 1; }
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable
      - run: dart pub get
      - name: Tag matches pubspec.yaml version
        run: |
          v="$(sed -n 's/^version: *//p' pubspec.yaml)"
          [ "$GITHUB_REF_NAME" = "v$v" ] || { echo "::error::tag $GITHUB_REF_NAME does not match pubspec.yaml version $v"; exit 1; }
      - run: dart analyze --fatal-infos
      - run: dart test
      - run: node scripts/brand.mjs
      - name: Brand is final (only when publishing is switched on)
        if: vars.PUB_DEV_PUBLISHING == 'true'
        run: node scripts/brand.mjs --release
      - run: dart pub publish --dry-run
      - if: vars.PUB_DEV_PUBLISHING != 'true'
        run: echo "::notice::PUB_DEV_PUBLISHING repo variable is not 'true', so nothing was published (see PUBLISHING.md)."
  publish:
    needs: verify
    if: vars.PUB_DEV_PUBLISHING == 'true'
    permissions:
      id-token: write # pub.dev verifies this workflow's OIDC token
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
