name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart analyze
      - run: dart test
      # The example (example/example.dart) compiled against this repo's source; never run (no network).
      - name: Build example
        run: mkdir -p build && dart compile exe example/example.dart -o build/example
      - run: node scripts/spec-vectors.mjs
      - run: node scripts/brand.mjs
      - run: dart pub publish --dry-run
